name: V1 checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: V1/frontend/.nvmrc
          cache: npm
          cache-dependency-path: V1/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:backend-contracts
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: curl --fail http://localhost:5173/health/ready
      - run: docker compose logs
        if: always()
      - run: docker compose down
        if: always()
