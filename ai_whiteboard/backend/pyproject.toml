[project]
name = "live-whiteboard-backend"
version = "0.1.0"
description = "Live Whiteboard backend with speech, incremental diagrams, streaming and B4 integration acceptance"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "PyYAML==6.0.3",
    "websockets==16.1.1",
    "anyio==4.16.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.2.1,<2",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "jsonschema==4.26.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]

[tool.ruff]
target-version = "py310"
line-length = 100
