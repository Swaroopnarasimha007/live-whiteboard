name: ai-whiteboard
services:
  model-init:
    build: ./backend
    image: ai-whiteboard-backend:local
    command: ["python", "-m", "scripts.models.ensure"]
    environment:
      MODE: ${MODE:-}
    volumes:
      - ./backend/config:/app/backend/config:ro
      - whisper-models:/app/backend/models
    restart: "no"
  backend:
    build: ./backend
    image: ai-whiteboard-backend:local
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      MODE: ${MODE:-}
      API_KEY: ${API_KEY:-}
    volumes:
      - ./backend/config:/app/backend/config:ro
      - whisper-models:/app/backend/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  whisper-models:
