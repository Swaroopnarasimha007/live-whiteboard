<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
  <title id="title">AI Whiteboard system architecture</title>
  <desc id="desc">React captures audio and exchanges PCM frames and transcript events with FastAPI over WebSocket. The browser posts the final transcript and board context as JSON. FastAPI runs Whisper locally and calls Groq for diagram generation. NDJSON events return to the browser, which validates and applies operations to the scene, renders it with Konva, and autosaves the drawing to IndexedDB.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#232427"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a9abb1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1078" height="608" rx="26" fill="url(#background)" stroke="#3b3c40" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="49" font-size="13" font-weight="700" letter-spacing="2" fill="#b5b7bf">SYSTEM ARCHITECTURE</text>
    <text x="40" y="92" font-size="36" font-weight="700" fill="#f5f5f7">AI Whiteboard</text>
    <text x="40" y="122" font-size="16" fill="#bfc1c7">Browser runtime, local speech inference, and streamed diagram generation</text>
    <g fill="#202124" stroke="#494b50">
      <rect x="40" y="153" width="290" height="376" rx="18"/>
      <rect x="648" y="153" width="392" height="376" rx="18"/>
    </g>
    <g fill="#f5f5f7" font-size="23" font-weight="650">
      <text x="62" y="191">Browser</text>
      <text x="670" y="191">FastAPI backend</text>
    </g>
    <g fill="#bfc1c7" font-size="14">
      <text x="62" y="215">React · TypeScript · Konva</text>
      <text x="670" y="215">Python · /api/v1</text>
    </g>
    <g fill="#2b2c30" stroke="#47494e">
      <rect x="60" y="233" width="250" height="70" rx="12"/>
      <rect x="60" y="315" width="250" height="70" rx="12"/>
      <rect x="60" y="397" width="250" height="70" rx="12"/>
      <rect x="668" y="233" width="352" height="70" rx="12"/>
      <rect x="668" y="315" width="352" height="70" rx="12"/>
      <rect x="668" y="397" width="352" height="70" rx="12"/>
    </g>
    <g fill="#f5f5f7" font-size="17" font-weight="650">
      <text x="75" y="260">Microphone capture</text>
      <text x="75" y="342">Session coordinator</text>
      <text x="75" y="424">Scene and canvas</text>
      <text x="684" y="260">Speech transcription</text>
      <text x="684" y="342">Generation orchestration</text>
      <text x="684" y="424">Diagram event stream</text>
    </g>
    <g fill="#c8c9cf" font-size="14">
      <text x="75" y="283">AudioWorklet · PCM capture</text>
      <text x="75" y="365">Final transcript + scene context</text>
      <text x="75" y="447">Validate → apply → render</text>
      <text x="684" y="283">Whisper Small · local inference</text>
      <text x="684" y="365">Groq API over HTTPS · GPT-OSS 120B</text>
      <text x="684" y="447">Validated operations and lifecycle events</text>
      <text x="62" y="504">IndexedDB · local drawing autosave</text>
      <text x="670" y="504">Provider credentials stay on the server</text>
    </g>
    <g fill="none" stroke="#a9abb1" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M341 268H637" marker-start="url(#arrow)"/>
      <path d="M341 350H637"/>
      <path d="M637 432H341"/>
    </g>
    <g fill="#f5f5f7" font-size="15" font-weight="650" text-anchor="middle">
      <text x="489" y="257">WebSocket · session audio</text>
      <text x="489" y="339">HTTP POST · /generations</text>
      <text x="489" y="421">HTTP response · NDJSON</text>
    </g>
    <g fill="#bfc1c7" font-size="13" text-anchor="middle">
      <text x="489" y="288">PCM frames out · transcript events back</text>
      <text x="489" y="370">JSON transcript and board context</text>
      <text x="489" y="452">Incremental diagram events</text>
    </g>
    <path d="M40 550H1040" stroke="#3d3e43"/>
    <text x="40" y="578" fill="#bfc1c7" font-size="14">Default backend configuration shown. Speech and diagram providers are configurable.</text>
  </g>
</svg>
